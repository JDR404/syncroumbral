[package]
name = "syncroumbral-slint"
version = "0.7.2"
edition = "2021"
description = "SyncroUmbral con interfaz nativa Slint (sin WebView): comparte el agente con la versión Tauri"
publish = false
license = "GPL-3.0-or-later"

# Crate independiente: no forma parte de desktop/src-tauri. Comparte sus módulos del agente con #[path].
[workspace]

[[bin]]
name = "syncroumbral"
path = "src/main.rs"

[features]
# Desactiva las pruebas de servidor que usan el entorno de pruebas de Tauri.
slint-ui = []
selftest = []
default = ["slint-ui"]

[dependencies]
# Renderizado por software (sin OpenGL ni GPU): funciona en cualquier PC y es lo que menos memoria usa.
slint = { version = "1.19", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030"] }
tray-icon = { version = "0.21", default-features = false }
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false }
arboard = { version = "3", default-features = false }

# ---- dependencias del agente (las mismas que desktop/src-tauri, sin Tauri)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
rcgen = "0.13"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
qrcode = "0.14"
local-ip-address = "0.6"
argon2 = "0.5"
anyhow = "1"
mdns-sd = "0.21.7"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
hmac = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_System_Shutdown"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell"] }

[build-dependencies]
slint-build = "1.19"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
i-slint-backend-testing = "1.19"
